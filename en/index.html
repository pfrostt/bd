  <main class="stage">
    <div class="copy">
      <h1 class="eyebrow">Boudoir photographer <span>in Malmö</span></h1>
      <p class="tease">What you see here is only a&nbsp;hint.<br><em>Most of it stays between&nbsp;us.</em></p>
      <button class="cta" type="button" data-open-contact>
        <span class="cta-label">It starts here</span>
        <span class="cta-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>

    </div>

      <div class="dots" aria-hidden="true"></div>
      <p class="note">Malmö, Lund &amp; Skåne<br>Never published without your consent</p>
    </div>
  </main>

  <dialog class="contact" aria-labelledby="contact-title">
    <button class="close" type="button" data-close-contact aria-label="Close">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>

    <form class="contact-form" novalidate>
      <h2 id="contact-title" class="contact-title">Tell me a little about yourself.<br><em>We'll take the rest slowly.</em></h2>

      <label class="field">
        <span>Name</span>
        <input name="name" type="text" autocomplete="given-name" maxlength="80" required>
      </label>
      <label class="field">
        <span>Email</span>
        <input name="email" type="email" autocomplete="email" maxlength="120" required>
      </label>
      <label class="field">
        <span>What draws you in?</span>
        <textarea name="message" rows="4" maxlength="2000" required placeholder="A feeling, an occasion, a gift to yourself..."></textarea>
      </label>
      <!-- honeypot: bots fill it, people never see it -->
      <input class="hp" type="checkbox" name="botcheck" tabindex="-1" autocomplete="off">

      <p class="privacy">What you share stays between us.</p>
      <button class="send" type="submit">Send</button>
      <p class="status" role="status" aria-live="polite"></p>
    </form>
  </dialog>
